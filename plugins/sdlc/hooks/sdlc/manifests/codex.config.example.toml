# Generated from hooks/sdlc/manifests/sdlc-hooks.json.
# Regenerate with: node hooks/sdlc/bin/generate-hook-configs.mjs
# Copy these entries into the user Codex config that your Codex version loads.
# Replace <RUNTIME_ROOT> with the absolute path to the user-level runtime.
# Projects do not need to copy hooks/sdlc; they only store docs/_sdlc state.
#
# Codex event names used here: sessionStart, preToolUse, postToolUse, stop, userPromptSubmit, preCompact, postCompact.

[hooks]
sessionStart = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs sessionStart" }
]
preToolUse = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs preToolUse" }
]
postToolUse = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs postToolUse" }
]
stop = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs stop" }
]
userPromptSubmit = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs userPromptSubmit" }
]
preCompact = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs preCompact" }
]
postCompact = [
  { command = "node <RUNTIME_ROOT>/hooks/sdlc/bin/codex-hook.mjs postCompact" }
]
